services:
  handle_utterance:
    name: 处理一句语音/文本指令
    description: >
      把一句话交给决策层：解析意图 -> 工具校验 -> 危险动作确认门禁 -> 幂等下发 -> 留痕。
      危险动作（门锁开启、燃气、总电源、大功率插座上电、安防撤防）在未确认前不会下发。
      返回 Decision；危险动作会额外触发 home_voice_safety_confirmation_required 事件。
    field:
      text:
        name: 文本
        description: 已经转写好的中文指令，例如「打开客厅大灯」「解锁入户门锁」。
        required: true
        example: 打开客厅大灯
        selector:
          text:
      session_id:
        name: 会话
        description: 同一会话内的待确认指令与幂等窗口互不串台；留空用 default。
        required: false
        default: default
        example: 客厅音箱
        selector:
          text:
  confirm_action:
    name: 确认待执行动作
    description: >
      释放一条待确认的危险动作。带 token 时按 token 精确确认；不带 token 时，仅当该会话
      恰好有一条待确认动作才会执行；有多条时返回需要澄清，绝不会随便挑一条执行。
      手机通知/物理按键的「确认」会自动调用本服务（见 blueprints）。
    field:
      token:
        name: 确认令牌
        description: handle_utterance 返回的 confirmation_token（也可从确认事件取得）。
        required: false
        example: a1b2c3d4e5
        selector:
          text:
      session_id:
        name: 会话
        description: 带 token 时可省略；不带 token 时用于定位该会话唯一的待确认动作。
        required: false
        default: default
        selector:
          text:
  cancel_action:
    name: 取消待执行动作
    description: 丢弃一条待确认动作，不向任何设备下发。手机通知/物理按键的「取消」会调用本服务。
    field:
      token:
        name: 确认令牌
        description: 要取消的 confirmation_token；省略时取消该会话唯一的待确认动作。
        required: false
        selector:
          text:
      session_id:
        name: 会话
        required: false
        default: default
        selector:
          text:
  list_pending:
    name: 列出待确认动作
    description: >
      返回仍在有效期内的待确认动作。省略 session_id 时聚合所有会话（多音箱/多房间）；
      返回含 token、目标、风险类别、trace_id 与剩余秒数，供自动化读取。
    field:
      session_id:
        name: 会话
        description: 留空/不填 = 聚合所有会话；填写则只返回该会话。
        required: false
        selector:
          text:
  export_audit:
    name: 导出审计记录
    description: >
      把决策审计导出为 CSV 或 JSON，写入 <config>/home_voice_safety/exports/。
      默认对用户原话做脱敏（redact_utterance=true）；CSV 表头稳定，JSON 为记录数组。
    field:
      trace_id:
        name: 追踪 ID
        description: 可选，只导出单次请求的完整决策链。
        required: false
        selector:
          text:
      since:
        name: 起始时间
        description: 可选，Unix 时间戳（秒），包含该时刻。
        required: false
        selector:
          number:
            mode: box
            min: 0
      until:
        name: 结束时间
        description: 可选，Unix 时间戳（秒），包含该时刻。
        required: false
        selector:
          number:
            mode: box
            min: 0
      format:
        name: 格式
        description: csv 或 json。
        required: false
        default: csv
        selector:
          select:
            options:
              - csv
              - json
      redact_utterance:
        name: 脱敏用户原话
        description: 默认 true；关闭后导出文件会包含用户原句，请仅在本地可信环境使用。
        required: false
        default: true
        selector:
          boolean:
  purge_audit:
    name: 清理过期审计
    description: >
      按保留期删除过期审计记录，默认使用 Settings.audit_retention_days（30 天，0=永久）。
      failed_unknown / in_flight_unknown 相关审计、待确认动作与幂等 unknown 行永不删除。
      返回 deleted 计数。
    field:
      before:
        name: 截止时间
        description: 可选，直接指定 Unix 时间戳；优先级高于 days。
        required: false
        selector:
          number:
            mode: box
            min: 0
      days:
        name: 保留天数
        description: 可选，覆盖 Settings；0 = 永久保留（本次不删）。
        required: false
        selector:
          number:
            mode: box
            min: 0
