name: CI

"on":
  push:
    branches:
      - "**"
  pull_request: {}

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install project and dev tools
        run: uv sync --dev
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy hvsl pipeline custom_components
      - name: Tests
        run: uv run pytest -o addopts="" -q
